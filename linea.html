<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea Verde Neón - Cometa con Degradado Real</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            overflow: hidden;
        }

        .fullscreen-chart {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: visible; 
        }

        /* Único círculo móvil (Cabeza del cometa) */
        .neon-circle {
            fill: #e5fff2;
            filter: url(#glow);
        }

        /* Cuerpo del cometa con el degradado aplicado en el stroke */
        .trail-path {
            stroke: url(#comet-gradient); /* Vinculamos el degradado aquí */
            stroke-width: 5;
            fill: none;
            stroke-linecap: round; 
            filter: url(#glow);
            transition: opacity 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="fullscreen-chart">
        <svg id="main-svg">
            <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="5" result="blur1" />
                    <feGaussianBlur stdDeviation="12" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <linearGradient id="comet-gradient" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#00D46E" stop-opacity="0" />     <stop offset="80%" stop-color="#00D46E" stop-opacity="0.6" />  <stop offset="100%" stop-color="#00D46E" stop-opacity="1" />   </linearGradient>
            </defs>

            <path id="graph-path" class="trail-path"></path>

            <circle id="moving-dot" class="neon-circle" r="7">
                <animateMotion 
                    id="motion-anim"
                    dur="6s" 
                    repeatCount="indefinite" 
                    rotate="auto"
                    calcMode="linear">
                    <mpath href="#graph-path"/>
                </animateMotion>
            </circle>
        </svg>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const path = document.getElementById("graph-path");
            const motionAnim = document.getElementById("motion-anim");
            const movingDot = document.getElementById("moving-dot");
            const gradient = document.getElementById("comet-gradient");

            // Variables para almacenar el punto de inicio
            let startX, startY;

            function ajustarRuta() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                
                startX = w * 0.25;
                startY = h + 50; 

                const d = `M ${startX} ${startY} 
                           C ${w * 0.25} ${h * 0.75}, ${w * 0.30} ${h * 0.75}, ${w * 0.40} ${h * 0.60} 
                           C ${w * 0.50} ${h * 0.45}, ${w * 0.55} ${h * 0.85}, ${w * 0.70} ${h * 0.45} 
                           C ${w * 0.80} ${h * 0.20}, ${w * 0.85} ${h * 0.05}, ${w + 100} -100`;
                
                path.setAttribute("d", d);
                
                motionAnim.endElement();
                motionAnim.beginElement();
            }

            ajustarRuta();
            window.addEventListener('resize', ajustarRuta);

            // Control de la estela y actualización de la dirección del gradiente
            function updateTrail() {
                const length = path.getTotalLength();
                const currentTime = motionAnim.getCurrentTime();
                const duration = 6; 
                
                const progress = (currentTime % duration) / duration;
                const maxTailLength = length * 0.40; 
                
                if (progress < 0.40) {
                    let visibleSegment = length * progress;
                    path.style.strokeDasharray = `${visibleSegment} ${length}`;
                    path.style.strokeDashoffset = 0;
                    path.style.opacity = 1;
                } else if (progress >= 0.40 && progress < 0.85) {
                    path.style.strokeDasharray = `${maxTailLength} ${length}`;
                    path.style.strokeDashoffset = -(length * progress - maxTailLength);
                    path.style.opacity = 1;
                } else {
                    const fadeProgress = (progress - 0.85) / 0.15; 
                    const remainingSegment = maxTailLength * (1 - fadeProgress);
                    
                    path.style.strokeDasharray = `${remainingSegment} ${length}`;
                    path.style.strokeDashoffset = -(length * progress - remainingSegment);
                    path.style.opacity = 1 - fadeProgress;
                }

                // COORDENADAS DINÁMICAS DEL GRADIENTE
                // Obtenemos la posición exacta (X, Y) en la pantalla del círculo usando su matriz de transformación
                const matrix = movingDot.getCTM();
                if (matrix) {
                    const dotX = matrix.e;
                    const dotY = matrix.f;

                    if (progress < 0.40) {
                        // Al inicio, el gradiente va desde el punto de origen de la pantalla hasta el círculo
                        gradient.setAttribute("x1", startX);
                        gradient.setAttribute("y1", startY);
                    } else {
                        // Durante el viaje, calculamos dónde termina matemáticamente la cola atrás en el path
                        const tailProgress = length * progress - maxTailLength;
                        const tailPoint = path.getPointAtLength(tailProgress >= 0 ? tailProgress : 0);
                        
                        gradient.setAttribute("x1", tailPoint.x);
                        gradient.setAttribute("y1", tailPoint.y);
                    }

                    // El punto final del gradiente (100% opacidad) siempre persigue el centro del círculo móvil
                    gradient.setAttribute("x2", dotX);
                    gradient.setAttribute("y2", dotY);
                }

                requestAnimationFrame(updateTrail);
            }

            requestAnimationFrame(updateTrail);
        });
    </script>
</body>
</html>
